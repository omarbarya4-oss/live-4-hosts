<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البث المباشر</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --text:#eef0f4; --muted:#8a92a3; --accent:#ff4d5e; --ok:#3ddc84; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  #join { max-width:360px; margin:15vh auto; background:var(--card); border:1px solid var(--line); padding:24px; border-radius:16px; }
  #join input, #join button { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); font-size:16px; margin-top:10px; }
  #join input { background:#0f1115; color:var(--text); }
  button.primary { background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:600; }
  #err { color:#ff8a94; margin-top:10px; font-size:14px; min-height:18px; }
  #err.info { color:var(--muted); }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 0 16px; }
  .topbar h1 { margin:0; }
  #leaveBtn { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 16px; font-size:14px; cursor:pointer; }
  #leaveBtn:hover { border-color:var(--accent); color:var(--accent); }

  /* الشاشة الكبيرة: المقدم المختار */
  #stage { position:relative; aspect-ratio:16/9; background:#000; border-radius:16px; overflow:hidden; border:1px solid var(--line); }
  #mainVideo { width:100%; height:100%; object-fit:contain; background:#000; display:block; } /* بدون قص حتى لو كان البث عموديًا */
  #mainVideo[hidden] { display:none; }
  #stageName { position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,.6); padding:6px 12px; border-radius:20px; font-size:14px; }

  /* بطاقات المقدمين الأربعة بفيديو مباشر صغير */
  #cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:8px; cursor:pointer; text-align:center; transition:border-color .15s; }
  .card.offline { opacity:.4; cursor:default; }
  .card.selected { border-color:var(--accent); }
  .thumb { position:relative; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .thumb video { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb:not(.has-video) video { visibility:hidden; }
  .thumb .avatar { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:40px; height:40px; border-radius:50%; background:var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; }
  .thumb.has-video .avatar { display:none; }
  .name { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status { font-size:12px; color:var(--muted); margin-top:4px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .card:not(.offline) .dot { background:var(--accent); }
  .card.speaking .dot { background:var(--ok); box-shadow:0 0 0 4px rgba(61,220,132,.25); }
  #hint { text-align:center; color:var(--muted); font-size:14px; margin-top:12px; }
  @media (max-width:640px) { #cards { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>

<div id="join">
  <h1>ادخل كمشاهد</h1>
  <input id="nameInput" placeholder="اسمك (اختياري)" maxlength="40">
  <button class="primary" id="joinBtn">دخول</button>
  <div id="err"></div>
</div>

<div class="wrap" id="app" hidden>
  <div class="topbar">
    <h1>🔴 البث المباشر</h1>
    <button id="leaveBtn">مغادرة</button>
  </div>
  <div id="stage">
    <video id="mainVideo" autoplay playsinline muted hidden></video>
    <div id="stageName" hidden></div>
  </div>
  <div id="cards"></div>
  <div id="hint">اضغط على أي مقدم لتسمعه وتشاهده بالحجم الكبير</div>
  <div id="audioBox" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<script>
const { Room, RoomEvent, Track, VideoQuality } = LivekitClient;

let room = null;
let selected = null;            // المقدم الذي نسمعه ونعرضه كبيرًا، مثل "host-2"
const speaking = new Set();
let leaving = false;            // صار true عند الضغط على زر المغادرة

const $ = (id) => document.getElementById(id);
const cardOf = (id) => document.getElementById('card-' + id);
const camPub = (p) => p && p.getTrackPublication(Track.Source.Camera);

$('joinBtn').onclick = join;
$('leaveBtn').onclick = () => { leaving = true; if (room) room.disconnect(); };
buildCards();

async function join() {
  $('err').textContent = '';
  $('err').className = '';
  leaving = false;
  $('joinBtn').disabled = true;
  try {
    const r = await fetch('/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: 'viewer', name: $('nameInput').value }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'فشل الدخول');

    // adaptiveStream مغلق: نحدد الجودة بأنفسنا (عالية للكبير، منخفضة للصغار)
    room = new Room({ adaptiveStream: false });
    wire(room);
    // autoSubscribe:false => نتحكم نحن بما نستقبله
    await room.connect(data.url, data.token, { autoSubscribe: false });
    await room.startAudio();

    $('join').hidden = true;
    $('app').hidden = false;

    // اختيار أول مقدم متصل تلقائيًا، واستقبال فيديو الجميع
    const first = liveHosts()[0];
    selected = first ? first.identity : null;
    applySubscriptions();
    render();
  } catch (e) {
    $('err').textContent = e.message;
    $('joinBtn').disabled = false;
  }
}

function wire(room) {
  room
    .on(RoomEvent.ParticipantConnected, () => { autoPickIfNone(); applySubscriptions(); render(); })
    .on(RoomEvent.ParticipantDisconnected, (p) => {
      if (p.identity === selected) selected = null;
      autoPickIfNone(); applySubscriptions(); render();
    })
    .on(RoomEvent.TrackPublished, () => { applySubscriptions(); render(); })
    .on(RoomEvent.TrackSubscribed, onTrackSubscribed)
    .on(RoomEvent.TrackUnsubscribed, onTrackUnsubscribed)
    .on(RoomEvent.TrackMuted, render)
    .on(RoomEvent.TrackUnmuted, render)
    .on(RoomEvent.ActiveSpeakersChanged, (list) => {
      speaking.clear();
      list.forEach((p) => speaking.add(p.identity));
      render();
    })
    .on(RoomEvent.AudioPlaybackStatusChanged, () => {
      if (!room.canPlaybackAudio) room.startAudio().catch(() => {});
    })
    .on(RoomEvent.Disconnected, () => {
      selected = null; speaking.clear(); resetMedia();
      $('app').hidden = true; $('join').hidden = false; $('joinBtn').disabled = false;
      $('err').className = leaving ? 'info' : '';
      $('err').textContent = leaving ? 'غادرت البث. يمكنك العودة متى شئت.' : 'انقطع الاتصال. حاول الدخول من جديد.';
    });
}

function liveHosts() {
  return [...room.remoteParticipants.values()].filter((p) => p.identity.startsWith('host-'));
}

function autoPickIfNone() {
  if (!selected) { const f = liveHosts()[0]; if (f) selected = f.identity; }
}

function select(identity) {
  if (identity === selected) return;
  selected = identity;
  applySubscriptions();
  render();
}

// فيديو كل المقدمين: نستقبله دائمًا (عالي للمختار، منخفض للبقية)
// الصوت: للمقدم المختار فقط
function applySubscriptions() {
  if (!room) return;
  liveHosts().forEach((p) => {
    const isSel = p.identity === selected;
    p.trackPublications.forEach((pub) => {
      const want = pub.kind === Track.Kind.Video ? true : isSel;
      // صوت غير المختار: نفصله ونحذفه فورًا قبل إلغاء الاشتراك
      if (!want && pub.kind === Track.Kind.Audio && pub.track) {
        pub.track.detach().forEach((el) => el.remove());
      }
      if (pub.isSubscribed !== want) pub.setSubscribed(want);
      if (want && pub.kind === Track.Kind.Video) {
        pub.setVideoQuality(isSel ? VideoQuality.HIGH : VideoQuality.LOW);
      }
    });
  });
  updateStage();
}

function onTrackSubscribed(track, pub, participant) {
  const id = participant.identity;
  if (!id.startsWith('host-')) return;
  if (track.kind === Track.Kind.Video) {
    const v = cardOf(id) && cardOf(id).querySelector('video');
    if (v) track.attach(v);
    pub.setVideoQuality(id === selected ? VideoQuality.HIGH : VideoQuality.LOW);
    updateStage();
  } else if (id === selected) {
    $('audioBox').appendChild(track.attach());
  }
  render();
}

function onTrackUnsubscribed(track) {
  // نحذف عناصر الصوت فقط؛ عناصر الفيديو ثابتة ونعيد استخدامها
  track.detach().forEach((el) => { if (el.tagName === 'AUDIO') el.remove(); });
  $('audioBox').querySelectorAll('audio').forEach((a) => { if (!a.srcObject) a.remove(); });
  updateStage();
  render();
}

// عرض المقدم المختار في الشاشة الكبيرة
function updateStage() {
  const main = $('mainVideo');
  const p = selected && room && room.remoteParticipants.get(selected);
  const pub = camPub(p);
  const t = pub && pub.isSubscribed ? pub.videoTrack : null;
  if (main._track && main._track !== t) { main._track.detach(main); main._track = null; }
  if (t && main._track !== t) { t.attach(main); main._track = t; }
  main.hidden = !t;
  $('stageName').hidden = !p;
  if (p) $('stageName').textContent = p.name || p.identity;
}

function resetMedia() {
  const main = $('mainVideo');
  if (main._track) { main._track.detach(main); main._track = null; }
  main.hidden = true;
  $('stageName').hidden = true;
  document.querySelectorAll('.thumb video').forEach((v) => { v.srcObject = null; });
  $('audioBox').innerHTML = '';
  render();
}

// تُبنى البطاقات مرة واحدة حتى لا تُعاد مقاطع الفيديو مع كل تحديث
function buildCards() {
  for (let n = 1; n <= 4; n++) {
    const id = `host-${n}`;
    const div = document.createElement('div');
    div.className = 'card offline';
    div.id = 'card-' + id;
    div.innerHTML = `
      <div class="thumb"><video autoplay playsinline muted></video><div class="avatar">${n}</div></div>
      <div class="name"></div>
      <div class="status"><span class="dot"></span><span class="st"></span></div>`;
    div.onclick = () => { if (room && room.remoteParticipants.get(id)) select(id); };
    $('cards').appendChild(div);
  }
  render();
}

function render() {
  for (let n = 1; n <= 4; n++) {
    const id = `host-${n}`;
    const card = cardOf(id);
    const p = room && room.remoteParticipants.get(id);
    const pub = camPub(p);
    const hasVideo = !!(pub && pub.isSubscribed && pub.track && !pub.isMuted);
    card.className = 'card'
      + (p ? '' : ' offline')
      + (selected === id ? ' selected' : '')
      + (speaking.has(id) ? ' speaking' : '');
    card.querySelector('.thumb').classList.toggle('has-video', hasVideo);
    card.querySelector('.name').textContent = p ? (p.name || id) : `مقدم ${n}`;
    let st = 'غير متصل';
    if (p) st = speaking.has(id) ? 'يتحدث الآن' : 'مباشر';
    if (p && selected === id) st += ' · تسمعه 🔊';
    card.querySelector('.st').textContent = st;
  }
}
</script>
</body>
</html>
